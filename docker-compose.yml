# Local development infrastructure for the Azure Certification Practice Tool.
#
# Start everything: `pnpm db:up`     (defined in root package.json)
# Stop everything:  `pnpm db:down`
#
# Mongo data persists across restarts via the named `mongo-data` volume.
# Wipe the dev DB completely with `docker compose down -v`.

services:
  mongo:
    image: mongo:7
    container_name: acpt-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
